<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tireRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wheelCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Outer Tire Outer Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#tireRim)"/>
  
  <!-- Tire Tread Ring Grooves -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Alloy Wheel Rim Inner Circle -->
  <circle cx="32" cy="32" r="19" fill="url(#wheelCenter)"/>

  <!-- Wheel Spokes (Sporty 5-spoke alloy design) -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="14"/>
    <line x1="32" y1="32" x2="49.1" y2="26.4"/>
    <line x1="32" y1="32" x2="42.5" y2="46.6"/>
    <line x1="32" y1="32" x2="21.5" y2="46.6"/>
    <line x1="32" y1="32" x2="14.9" y2="26.4"/>
  </g>

  <!-- Center Hub Cap -->
  <circle cx="32" cy="32" r="6" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3.5" fill="#2563eb"/>
</svg>
