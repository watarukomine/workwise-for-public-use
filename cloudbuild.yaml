steps:
  # 1. 依存関係のインストール
  - name: 'node:20'
    id: 'Install'
    entrypoint: 'npm'
    args: ['install', '--quiet']

  # 2. Next.js のビルド
  - name: 'node:20'
    id: 'Build'
    entrypoint: 'npm'
    args: ['run', 'build']

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8' # メモリ不足対策
