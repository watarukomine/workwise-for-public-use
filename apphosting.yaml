# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# The location of the backend.
# https://firebase.google.com/docs/app-hosting/locations
location: asia-northeast1

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  availability: public

# Define environment variables and secrets for the backend.
# https://firebase.google.com/docs/app-hosting/configure-backend#environment-variables
# The secret configuration has been removed to resolve build errors.
# The API key should now be managed via the .env file.
env:
  - variable: NEXT_PUBLIC_NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyDfAmBI1EdkkioSggCVhsUTi-oSQBIWdHw
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    value: DEMO_MAP_ID
  - variable: GOOGLE_API_KEY
    value: AIzaSyDfAmBI1EdkkioSggCVhsUTi-oSQBIWdHw
  - variable: GEMINI_API_KEY
    value: AIzaSyDfAmBI1EdkkioSggCVhsUTi-oSQBIWdHw
  - variable: NEXT_PUBLIC_STAFF_GAS_URL
    value: https://script.google.com/macros/s/AKfycbxGeXICGCJIbu-EuaRINfiVp1UTEz3IO9A2bGP-monXgwIHIv7PRomaFaM-s10KppDWzA/exec
  - variable: NEXT_PUBLIC_CUSTOMER_GAS_URL
    value: https://script.google.com/macros/s/AKfycbz9CFA3PdNTi5fQhnxz5Dm6-copXjMPpCKvJtSGB80Na5cVSsdYXfgO-g5EQPK66BrcCA/exec
  - variable: NEXT_PUBLIC_ORDER_GAS_URL
